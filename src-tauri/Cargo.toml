[package]
name = "slate-viewer"
version = "0.1.0"
description = "Desktop Markdown viewer and editor built on Slate"
authors = ["Dave"]
edition = "2021"

[lib]
name = "slate_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: Help > Developer Tools (and F12) work in release builds too, not just `tauri dev`.
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tauri-plugin-window-state = "2"
# Update checks and setting up mtsync (updates.rs).
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
sha2 = "0.10"

# Smaller, faster installer builds. Debug builds are unaffected.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
